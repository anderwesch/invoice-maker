name: Bug
description: Relato de defeito ou regressao
title: "bug: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Resumo
      description: O que esta quebrado?
      placeholder: Descreva o problema de forma objetiva.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: Como reproduzir o problema?
      placeholder: |
        1. Acesse...
        2. Clique em...
        3. Veja o erro...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
      placeholder: O que deveria acontecer?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamento atual
      placeholder: O que aconteceu de fato?
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impacto
      description: Qual e o impacto no uso real?
      placeholder: Baixo, medio, alto e por que.
